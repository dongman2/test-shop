<h1>Welcome to the demo</h1>

  <!DOCTYPE html>
<html>
<head>
  <title>ecommerce dataLayer trigger</title>
</head>
<body>

  <button id="sendSelectItem">Send Select Item</button>
  <button id="sendAddToCart">Send Add To Cart</button>
  <button id="sendPurchase">Send Purchase</button>

  <script>
    // Ensure dataLayer is initialized
    window.dataLayer = window.dataLayer || [];

    // Handle "select_item" event
    document.getElementById("sendSelectItem").addEventListener("click", function () {
      dataLayer.push({ ecommerce: null }); // Clear previous ecommerce object

      dataLayer.push({
        event: "select_item",
        ecommerce: {
          item_list_id: "related_products",
          item_list_name: "Related products",
          items: [
            {
              item_id: "SKU_12345",
              item_name: "Stan and Friends Tee",
              affiliation: "Google Merchandise Store",
              coupon: "SUMMER_FUN",
              discount: 2.22,
              index: 0,
              item_brand: "Google",
              item_category: "Apparel",
              item_category2: "Adult",
              item_category3: "Shirts",
              item_category4: "Crew",
              item_category5: "Short sleeve",
              item_list_id: "related_products",
              item_list_name: "Related Products",
              item_variant: "green",
              location_id: "ChIJIQBpAG2ahYAR_6128GcTUEo",
              price: 10.01,
              quantity: 3
            }
          ]
        }
      });

      alert("Select Item event pushed to dataLayer!");
    });

    // Handle "add_to_cart" event
    document.getElementById("sendAddToCart").addEventListener("click", function () {
      dataLayer.push({ ecommerce: null }); // Clear previous ecommerce object

      dataLayer.push({
        event: "add_to_cart",
        ecommerce: {
          currency: "USD",
          value: 30.03,
          items: [
            {
              item_id: "SKU_12345",
              item_name: "Stan and Friends Tee",
              affiliation: "Google Merchandise Store",
              coupon: "SUMMER_FUN",
              discount: 2.22,
              index: 0,
              item_brand: "Google",
              item_category: "Apparel",
              item_category2: "Adult",
              item_category3: "Shirts",
              item_category4: "Crew",
              item_category5: "Short sleeve",
              item_list_id: "related_products",
              item_list_name: "Related Products",
              item_variant: "green",
              location_id: "ChIJIQBpAG2ahYAR_6128GcTUEo",
              price: 10.01,
              quantity: 3
            }
          ]
        }
      });

      alert("Add To Cart event pushed to dataLayer!");
    });

    // Handle "purchase" event
    document.getElementById("sendPurchase").addEventListener("click", function () {
      dataLayer.push({ ecommerce: null }); // Clear previous ecommerce object

      dataLayer.push({
        event: "purchase",
        ecommerce: {
          transaction_id: "T_12345",
          value: 72.05,
          tax: 3.60,
          shipping: 5.99,
          currency: "USD",
          coupon: "SUMMER_SALE",
          items: [
            {
              item_id: "SKU_12345",
              item_name: "Stan and Friends Tee",
              affiliation: "Google Merchandise Store",
              coupon: "SUMMER_FUN",
              discount: 2.22,
              index: 0,
              item_brand: "Google",
              item_category: "Apparel",
              item_category2: "Adult",
              item_category3: "Shirts",
              item_category4: "Crew",
              item_category5: "Short sleeve",
              item_list_id: "related_products",
              item_list_name: "Related Products",
              item_variant: "green",
              location_id: "ChIJIQBpAG2ahYAR_6128GcTUEo",
              price: 10.01,
              quantity: 3
            },
            {
              item_id: "SKU_12346",
              item_name: "Google Grey Women's Tee",
              affiliation: "Google Merchandise Store",
              coupon: "SUMMER_FUN",
              discount: 3.33,
              index: 1,
              item_brand: "Google",
              item_category: "Apparel",
              item_category2: "Adult",
              item_category3: "Shirts",
              item_category4: "Crew",
              item_category5: "Short sleeve",
              item_list_id: "related_products",
              item_list_name: "Related Products",
              item_variant: "gray",
              location_id: "ChIJIQBpAG2ahYAR_6128GcTUEo",
              price: 21.01,
              promotion_id: "P_12345",
              promotion_name: "Summer Sale",
              quantity: 2
            }
          ]
        }
      });

      alert("Purchase event pushed to dataLayer!");
    });
  </script>

</body>
</html>
